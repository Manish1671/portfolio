<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="rgba(148,163,184,0.06)" stroke-width="1">
    <line x1="60" y1="80" x2="770" y2="80"/>
    <line x1="60" y1="140" x2="770" y2="140"/>
    <line x1="60" y1="200" x2="770" y2="200"/>
    <line x1="60" y1="260" x2="770" y2="260"/>
    <line x1="60" y1="320" x2="770" y2="320"/>
    <line x1="60" y1="380" x2="770" y2="380"/>
  </g>

  <!-- Title -->
  <text x="40" y="38" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui">Electric Vehicle Population Dashboard</text>
  <text x="40" y="58" fill="#6366f1" font-size="11" font-family="system-ui">230,000+ Records · Power BI · Tableau · Excel</text>

  <!-- KPI Cards -->
  <rect x="40" y="72" width="148" height="64" rx="10" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="56" y="92" fill="#8b9cf4" font-size="10" font-family="system-ui">Total EVs</text>
  <text x="56" y="118" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui">230.8K</text>

  <rect x="202" y="72" width="148" height="64" rx="10" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="218" y="92" fill="#c084fc" font-size="10" font-family="system-ui">BEV Count</text>
  <text x="218" y="118" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui">189.6K</text>

  <rect x="364" y="72" width="148" height="64" rx="10" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <text x="380" y="92" fill="#7dd3fc" font-size="10" font-family="system-ui">PHEV Count</text>
  <text x="380" y="118" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui">41.2K</text>

  <rect x="526" y="72" width="148" height="64" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="542" y="92" fill="#86efac" font-size="10" font-family="system-ui">Avg Range (mi)</text>
  <text x="542" y="118" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui">67.8</text>

  <!-- Bar chart: Top manufacturers -->
  <text x="40" y="165" fill="#94a3b8" font-size="10" font-family="system-ui">Top Manufacturers by Count</text>

  <!-- Tesla -->
  <rect x="80" y="230" width="82" height="110" fill="url(#bar1)" rx="5"/>
  <text x="121" y="353" fill="#94a3b8" font-size="9" font-family="system-ui" text-anchor="middle">Tesla</text>
  <text x="121" y="225" fill="#a5b4fc" font-size="10" font-weight="600" font-family="system-ui" text-anchor="middle">68.9K</text>

  <!-- Nissan -->
  <rect x="175" y="285" width="82" height="55" fill="url(#bar2)" rx="5"/>
  <text x="216" y="353" fill="#94a3b8" font-size="9" font-family="system-ui" text-anchor="middle">Nissan</text>
  <text x="216" y="280" fill="#c4b5fd" font-size="10" font-weight="600" font-family="system-ui" text-anchor="middle">13.5K</text>

  <!-- Chevrolet -->
  <rect x="270" y="298" width="82" height="42" fill="url(#bar1)" rx="5" opacity="0.8"/>
  <text x="311" y="353" fill="#94a3b8" font-size="9" font-family="system-ui" text-anchor="middle">Chevrolet</text>
  <text x="311" y="293" fill="#a5b4fc" font-size="10" font-weight="600" font-family="system-ui" text-anchor="middle">12.8K</text>

  <!-- Ford -->
  <rect x="365" y="308" width="82" height="32" fill="url(#bar2)" rx="5" opacity="0.75"/>
  <text x="406" y="353" fill="#94a3b8" font-size="9" font-family="system-ui" text-anchor="middle">Ford</text>
  <text x="406" y="302" fill="#c4b5fd" font-size="10" font-weight="600" font-family="system-ui" text-anchor="middle">7.6K</text>

  <!-- BMW -->
  <rect x="460" y="318" width="82" height="22" fill="url(#bar1)" rx="5" opacity="0.7"/>
  <text x="501" y="353" fill="#94a3b8" font-size="9" font-family="system-ui" text-anchor="middle">BMW</text>
  <text x="501" y="312" fill="#a5b4fc" font-size="10" font-weight="600" font-family="system-ui" text-anchor="middle">4.8K</text>

  <!-- Line chart: YoY growth -->
  <text x="40" y="390" fill="#94a3b8" font-size="10" font-family="system-ui">Year-over-Year EV Adoption Growth</text>
  <polyline points="80,465 170,450 260,440 350,420 440,400 530,375 620,348 710,318" fill="none" stroke="url(#line1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- dots -->
  <circle cx="80" cy="465" r="4" fill="#6366f1"/>
  <circle cx="170" cy="450" r="4" fill="#7c5ef0"/>
  <circle cx="260" cy="440" r="4" fill="#8b52ef"/>
  <circle cx="350" cy="420" r="4" fill="#9847ee"/>
  <circle cx="440" cy="400" r="4" fill="#a53ded"/>
  <circle cx="530" cy="375" r="4" fill="#b030ec"/>
  <circle cx="620" cy="348" r="4" fill="#bc25eb"/>
  <circle cx="710" cy="318" r="5" fill="#a855f7" stroke="rgba(168,85,247,0.4)" stroke-width="3"/>

  <!-- Year labels -->
  <text x="78" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2016</text>
  <text x="168" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2017</text>
  <text x="258" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2018</text>
  <text x="348" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2019</text>
  <text x="438" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2020</text>
  <text x="528" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2021</text>
  <text x="618" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2022</text>
  <text x="708" y="480" fill="#475569" font-size="9" font-family="system-ui" text-anchor="middle">2023</text>

  <!-- Donut chart for CAFV eligibility (right side) -->
  <text x="570" y="165" fill="#94a3b8" font-size="10" font-family="system-ui">CAFV Eligibility</text>
  <circle cx="680" cy="275" r="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="18"/>
  <circle cx="680" cy="275" r="55" fill="none" stroke="#6366f1" stroke-width="18" stroke-dasharray="207 138" stroke-dashoffset="-34" stroke-linecap="round"/>
  <circle cx="680" cy="275" r="55" fill="none" stroke="#a855f7" stroke-width="18" stroke-dasharray="90 255" stroke-dashoffset="-241" stroke-linecap="round"/>
  <circle cx="680" cy="275" r="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18" stroke-dasharray="48 297" stroke-dashoffset="-331" stroke-linecap="round"/>
  <text x="680" y="278" fill="#e2e8f0" font-size="13" font-weight="700" font-family="system-ui" text-anchor="middle">60%</text>
  <text x="680" y="292" fill="#94a3b8" font-size="8" font-family="system-ui" text-anchor="middle">Eligible</text>

  <!-- Legend -->
  <rect x="610" y="345" width="10" height="10" fill="#6366f1" rx="2"/>
  <text x="624" y="354" fill="#94a3b8" font-size="9" font-family="system-ui">Clean Fuel Eligible</text>
  <rect x="610" y="362" width="10" height="10" fill="#a855f7" rx="2"/>
  <text x="624" y="371" fill="#94a3b8" font-size="9" font-family="system-ui">Not Eligible</text>
  <rect x="610" y="379" width="10" height="10" fill="rgba(255,255,255,0.08)" rx="2"/>
  <text x="624" y="388" fill="#94a3b8" font-size="9" font-family="system-ui">Unknown</text>
</svg>
